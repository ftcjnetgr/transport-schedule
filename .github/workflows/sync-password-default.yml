name: Sync password default

on:
  push:
    branches: [main]

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update initial password rules
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.tsx')
          s = p.read_text()
          s = s.replace("password.length<4", "password.length<6")
          s = s.replace("Password minimal 4 karakter ya.", "Password minimal 6 karakter ya.")
          s = s.replace("password==='1234'", "password==='123456'")
          s = s.replace("Password baru jangan pakai 1234 ya.", "Password baru jangan pakai 123456 ya.")
          s = s.replace("minLength={4}", "minLength={6}")
          s = s.replace("placeholder=\"Min. 4 karakter\"", "placeholder=\"Min. 6 karakter\"")
          s = s.replace("Password awal akun baru: <strong>1234</strong>", "Password awal akun baru: <strong>123456</strong>")
          p.write_text(s)
          p = Path('src/MasterData.tsx')
          s = p.read_text().replace("password awal <strong>1234</strong>", "password awal <strong>123456</strong>")
          p.write_text(s)
          PY
          rm .github/workflows/sync-password-default.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/MasterData.tsx .github/workflows/sync-password-default.yml
          git commit -m "fix: align initial password to 123456"
          git push

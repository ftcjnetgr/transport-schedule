name: Fix password and font
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.tsx')
          s=p.read_text()
          old="if(e2){setError('Password baru belum bisa disimpan. Coba lagi ya.');setBusy(false);return}"
          new="if(e2){const m=e2.message.toLowerCase();let msg='Password baru belum bisa disimpan. Coba lagi ya.';if(m.includes('same')||m.includes('different'))msg='Password baru harus berbeda dari password sebelumnya ya.';else if(m.includes('weak')||m.includes('strength')||m.includes('characters'))msg='Password baru minimal 6 karakter dan gunakan password yang lebih aman ya.';else if(m.includes('session')||m.includes('jwt')||m.includes('refresh'))msg='Sesi login sudah kedaluwarsa. Silakan masuk lagi ya.';setError(msg);setBusy(false);return}"
          if old not in s: raise SystemExit('main patch target not found')
          p.write_text(s.replace(old,new))
          p=Path('src/styles.css')
          s=p.read_text()
          s=s.replace(":root{font-family:'Gilroy-Regular',sans-serif;",":root{font-family:'Gilroy-Regular','Gilroy',Arial,sans-serif;font-weight:500;")
          s=s.replace('.eyebrow{display:inline-block;font-size:11px;font-weight:800;', '.eyebrow{display:inline-block;font-size:11px;font-weight:600;')
          s=s.replace('label{display:grid;gap:8px;color:#334155;font-size:13px;font-weight:700}', 'label{display:grid;gap:8px;color:#334155;font-size:13px;font-weight:500}')
          s=s.replace('.primary,.secondary,.back-button{border:0;border-radius:13px;padding:13px 18px;font-weight:700;', '.primary,.secondary,.back-button{border:0;border-radius:13px;padding:13px 18px;font-weight:600;')
          s=s.replace('.top-title{font-size:18px;font-weight:800}', '.top-title{font-size:18px;font-weight:600}')
          s=s.replace('font-size:12px;font-weight:700}', 'font-size:12px;font-weight:500}')
          s=s.replace('.route-code{margin-top:6px;font-size:21px;font-weight:800;', '.route-code{margin-top:6px;font-size:21px;font-weight:600;')
          s=s.replace('.time-row b{font-size:20px}', '.time-row b{font-size:20px;font-weight:600}')
          s=s.replace('.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;color:#64748b;font-weight:700;', '.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;color:#64748b;font-weight:600;')
          s=s.replace('.status{padding:6px 9px;border-radius:999px;background:#f1f5f9;font-weight:800;', '.status{padding:6px 9px;border-radius:999px;background:#f1f5f9;font-weight:600;')
          s=s.replace('.confirmed{display:inline-flex;align-items:center;gap:5px;color:#047857!important;font-weight:800}', '.confirmed{display:inline-flex;align-items:center;gap:5px;color:#047857!important;font-weight:600}')
          p.write_text(s)
          PY
      - name: Remove temporary workflow and trigger
        run: |
          rm -f .github/workflows/fix-password-font.yml PASSWORD_FONT_FIX_TRIGGER.txt
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/main.tsx src/styles.css .github/workflows/fix-password-font.yml PASSWORD_FONT_FIX_TRIGGER.txt
          git commit -m "fix: password error handling and use medium Gilroy" || exit 0
          git push

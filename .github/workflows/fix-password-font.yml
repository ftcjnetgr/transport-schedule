name: Fix password and font
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.tsx')
          s=p.read_text()
          old="const {error:e2}=await supabase.auth.updateUser({password});if(e2){setError('Password baru belum bisa disimpan. Coba lagi ya.');setBusy(false);return}const {error:e3}=await supabase.rpc('mark_password_changed');if(e3){setError('Password berhasil diperbarui, tapi status akun belum tersimpan. Coba lagi ya.');setBusy(false);return}onChanged()"
          new="const {data:result,error:e2}=await supabase.functions.invoke('change-password',{body:{password}});if(e2){setError('Sesi login bermasalah. Silakan masuk lagi ya.');setBusy(false);return}if(!result?.ok){setError(result?.error||'Password baru belum bisa disimpan. Coba lagi ya.');setBusy(false);return}onChanged()"
          if old not in s: raise SystemExit('password patch target not found')
          p.write_text(s.replace(old,new))
          p=Path('src/styles.css')
          s=p.read_text()
          s=s.replace(":root{font-family:'Gilroy-Regular',sans-serif;",":root{font-family:'Gilroy-Medium','Gilroy-Regular',sans-serif;")
          s=s.replace("h1{margin:0 0 10px;font-size:clamp(32px,6vw,46px);line-height:1.05;letter-spacing:-.04em}", "h1{margin:0 0 10px;font-size:clamp(32px,6vw,46px);line-height:1.05;letter-spacing:-.04em;font-family:'Gilroy-Medium','Gilroy-Regular',sans-serif;font-weight:400}")
          s=s.replace('.eyebrow{display:inline-block;font-size:11px;font-weight:800;', '.eyebrow{display:inline-block;font-size:11px;font-weight:400;')
          s=s.replace('label{display:grid;gap:8px;color:#334155;font-size:13px;font-weight:700}', 'label{display:grid;gap:8px;color:#334155;font-size:13px;font-weight:400}')
          s=s.replace('.primary,.secondary,.back-button{border:0;border-radius:13px;padding:13px 18px;font-weight:700;', '.primary,.secondary,.back-button{border:0;border-radius:13px;padding:13px 18px;font-weight:400;')
          s=s.replace('.top-title{font-size:18px;font-weight:800}', '.top-title{font-size:18px;font-weight:400}')
          s=s.replace('.route-code{margin-top:6px;font-size:21px;font-weight:800;', '.route-code{margin-top:6px;font-size:21px;font-weight:400;')
          s=s.replace('.time-row b{font-size:20px}', '.time-row b{font-size:20px;font-weight:400}')
          s=s.replace('.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;color:#64748b;font-weight:700;', '.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;color:#64748b;font-weight:400;')
          s=s.replace('.status{padding:6px 9px;border-radius:999px;background:#f1f5f9;font-weight:800;', '.status{padding:6px 9px;border-radius:999px;background:#f1f5f9;font-weight:400;')
          s=s.replace('.confirmed{display:inline-flex;align-items:center;gap:5px;color:#047857!important;font-weight:800}', '.confirmed{display:inline-flex;align-items:center;gap:5px;color:#047857!important;font-weight:400}')
          p.write_text(s)
          PY
      - name: Remove temporary workflow and trigger
        run: rm -f .github/workflows/fix-password-font.yml PASSWORD_FONT_FIX_TRIGGER.txt
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "fix: secure password change and medium Gilroy" || exit 0
          git push
name: Fix login profile lookup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix profile queries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.tsx')
          s = p.read_text()
          old1 = "const {error:signInError}=await supabase.auth.signInWithPassword({email:usernameToEmail(username),password});if(signInError){setError('ID atau password belum cocok. Coba lagi.');setBusy(false);return}const {data,error:profileError}=await supabase.from('profiles').select('id, username, hub_id, role, active, must_change_password').single();"
          new1 = "const {error:signInError}=await supabase.auth.signInWithPassword({email:usernameToEmail(username),password});if(signInError){setError('ID atau password belum cocok. Coba lagi.');setBusy(false);return}const {data:sessionData}=await supabase.auth.getSession();const userId=sessionData.session?.user.id;if(!userId){await supabase.auth.signOut();setError('Session login tidak ditemukan. Coba lagi.');setBusy(false);return}const {data,error:profileError}=await supabase.from('profiles').select('id, username, hub_id, role, active, must_change_password').eq('id',userId).single();"
          old2 = "if(data.session){const{data:p}=await supabase.from('profiles').select('id, username, hub_id, role, active, must_change_password').single();"
          new2 = "if(data.session){const{data:p}=await supabase.from('profiles').select('id, username, hub_id, role, active, must_change_password').eq('id',data.session.user.id).single();"
          changed = False
          if old1 in s:
              s = s.replace(old1, new1, 1)
              changed = True
          if old2 in s:
              s = s.replace(old2, new2, 1)
              changed = True
          if not changed:
              raise SystemExit('No matching profile query found')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          git commit -m "fix: scope profile lookup to authenticated user"
          git push

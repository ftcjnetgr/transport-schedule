name: Fix TypeScript type-only imports
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix FormEvent import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.tsx')
          s = p.read_text()
          s = s.replace("import { FormEvent, StrictMode, useEffect, useMemo, useState } from 'react'", "import { StrictMode, useEffect, useMemo, useState } from 'react'\nimport type { FormEvent } from 'react'")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          git commit -m "fix: use type-only import for FormEvent"
          git push
